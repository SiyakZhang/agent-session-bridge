[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-session-bridge"
version = "0.3.7"
description = "Connect Codex and Claude Code sessions across machines to your chat app"
requires-python = ">=3.10"
dependencies = ["dingtalk-stream==0.24.3", "requests>=2.32,<3", "paramiko>=3.5,<5", "psutil>=6,<8", "Pillow>=10.4,<13", "websocket-client==1.8.0", "markdown-it-py>=4,<5"]

[project.urls]
Repository = "https://github.com/SiyakZhang/agent-session-bridge"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
session-bridge = "session_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["session_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
