[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dingtalk-session-bridge"
version = "0.1.0"
description = "Multi-computer DingTalk bridge for existing Codex and Claude sessions"
requires-python = ">=3.10"
dependencies = ["dingtalk-stream==0.24.3", "requests>=2.32,<3", "paramiko>=3.5,<5", "psutil>=6,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
session-bridge = "session_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["session_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
